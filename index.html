<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Universal Mobile Mapping GIS — pemetaan lapangan offline-first, layer SHP/KML/GeoTIFF/GeoPDF, cetak peta A4/A3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https: data: blob:; worker-src 'self' blob:; child-src blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Universal Mobile Mapping GIS — Demo</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root{--accent:#0f766e;--accent-2:#115e59;--bg:#f3f5f8;--panel:#ffffff;--panel-2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--info:#2563eb;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);--radius:12px;--top:56px;--side:232px;--bottom:62px;font-synthesis:none}
[data-theme=dark]{--bg:#0b1220;--panel:#111a2b;--panel-2:#0f172a;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;min-height:38px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}.btn.danger.solid{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}.btn[disabled]{opacity:.5;pointer-events:none}
.btn.icon{padding:0;width:40px;min-width:40px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;min-height:40px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}label.f span.req{color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.b-draft{color:#475569}.b-submitted{color:var(--info);border-color:#bfdbfe}.b-approved{color:var(--ok);border-color:#bbf7d0}.b-revision{color:var(--warn);border-color:#fde68a}.b-rejected{color:var(--danger);border-color:#fecaca}.b-pending{color:#c2410c;border-color:#fed7aa}
.svg{width:18px;height:18px;flex:none}
/* ---------- Login ---------- */
#login{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:18px}
.login-brand img{width:76px;height:76px;object-fit:contain;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);cursor:zoom-in}
.login-brand h1{margin:0;font-size:20px}.login-brand p{margin:0;color:var(--muted)}
.pw-wrap{position:relative}.pw-wrap .btn{position:absolute;right:4px;top:4px;min-height:32px}
.demo-box{margin-top:14px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.login-foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
/* ---------- Shell ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) minmax(0,1fr);grid-template-columns:var(--side) minmax(0,1fr);grid-template-areas:"top top" "side main"}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.topbar .logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:var(--panel-2);border:1px solid var(--line);cursor:zoom-in}
.topbar>*{flex-shrink:0}.topbar .ttl{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;flex-shrink:1}.topbar .ttl b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .ttl small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--panel-2);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--danger)}.dot.warn{background:var(--warn)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.sidenav{grid-area:side;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;border:0;background:none;text-align:left;width:100%}
.nav-i:hover{background:var(--panel-2);color:var(--text)}.nav-i.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.nav-i .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted)}
main{grid-area:main;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow:auto;padding:18px}.tab.map{padding:0;overflow:hidden}
.tab-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tab-h h2{margin:0;font-size:19px}
.bottomnav{display:none}
/* ---------- Map ---------- */
#map{position:absolute;inset:0}
.map-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}
.map-top>*{pointer-events:auto}
.map-top select{max-width:220px;box-shadow:var(--shadow)}
.tools{position:absolute;right:10px;top:64px;display:flex;flex-direction:column;gap:6px;z-index:5}
.tools .btn{width:44px;height:44px;padding:0;box-shadow:var(--shadow);border-radius:11px}
.tools .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gps-chip{position:absolute;left:10px;bottom:30px;z-index:5;box-shadow:var(--shadow);max-width:calc(100% - 70px)}.gps-chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draw-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 20px);width:560px}
.layer-panel{position:absolute;right:62px;top:64px;z-index:7;width:320px;max-width:calc(100% - 80px);max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.layer-panel h4{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.lyr{display:flex;align-items:center;gap:8px;padding:5px 0}.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.maplibregl-ctrl-attrib{font-size:10px}
/* ---------- Lists / tables ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;cursor:pointer}
.item:hover{border-color:var(--accent)}.item .meta{min-width:0;flex:1}.item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
table.t th{background:var(--panel-2);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.tscroll{overflow:auto;border-radius:11px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi .card{padding:14px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar .lbl{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .trk{flex:1;height:10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}.bar .fill{height:100%;background:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--accent);color:#fff}
.legal h4{margin:16px 0 6px}.legal p,.legal li{color:var(--text);opacity:.9}
.skeleton{background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* ---------- Modal / sheet / toast / zoom ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s ease}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}.modal .mh b{font-size:16px;flex:1}
.modal .mb{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:90vw;animation:fade .15s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--ok)}
.zoomer{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.92);touch-action:none;overflow:hidden;user-select:none}
.zoomer img{position:absolute;left:50%;top:50%;max-width:92vw;max-height:86vh;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
.zoomer .zbar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:6px;background:rgba(15,23,42,.8);padding:6px;border-radius:12px}
.zoomer .zbar button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;min-width:42px;height:38px;cursor:pointer;font-weight:700}
.zoomer .zcap{position:absolute;top:14px;left:16px;color:#e2e8f0;font-weight:600}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}.menu button:hover{background:var(--panel-2)}
.progress{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}.progress>div{height:100%;background:var(--accent);width:0}
/* ---------- Responsif ---------- */
@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) var(--bottom);grid-template-areas:"top" "main" "bottom"}
  .sidenav{display:none}
  .sidenav.open{display:flex;position:fixed;top:var(--top);left:0;bottom:var(--bottom);width:260px;z-index:40;box-shadow:var(--shadow)}
  .bottomnav{grid-area:bottom;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav .cnt{position:absolute;top:6px;right:calc(50% - 20px);background:var(--warn);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  .tab{padding:12px}
  .tab-h h2{flex-basis:100%}
  .topbar .ttl small{display:none}
  .hide-m{display:none!important}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:100%!important;border-radius:16px 16px 0 0;max-height:92%}
  .draw-panel{bottom:10px}
  .layer-panel{right:10px;left:10px;width:auto;max-width:none;top:60px}
  .map-top select{max-width:46vw}
}
@media (min-width: 861px){.show-m{display:none!important}}
@media (max-width: 520px){#pill-net .lbl{display:none}.topbar{gap:6px;padding:0 8px}.topbar .logo{width:32px;height:32px}.pill{padding:4px 8px}}

</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="login-card">
    <div class="login-brand">
      <img id="lg-logo" alt="Logo" title="Klik untuk memperbesar">
      <div><h1 id="lg-title">Universal Mobile Mapping GIS</h1><p id="lg-sub">Enterprise Field Mapping</p></div>
    </div>
    <form id="lg-form" class="col" autocomplete="on">
      <label class="f">Username<input class="input" id="lg-user" name="username" autocomplete="username" autocapitalize="none" required maxlength="60"></label>
      <label class="f">Password<div class="pw-wrap"><input class="input" id="lg-pass" type="password" name="password" autocomplete="current-password" required maxlength="128"><button type="button" class="btn ghost sm" id="lg-eye" aria-label="Tampilkan password">Lihat</button></div></label>
      <div id="lg-err" class="small" style="color:var(--danger);min-height:18px" role="alert"></div>
      <button class="btn primary" id="lg-btn" type="submit">Masuk</button>
    </form>
    <div id="lg-server" class="hidden" style="margin-top:12px">
      <details><summary class="small muted" style="cursor:pointer">Pengaturan server</summary>
        <div class="col" style="margin-top:8px"><label class="f">URL Web App Apps Script<input class="input mono small" id="lg-api" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <button type="button" class="btn sm" id="lg-api-save">Simpan &amp; uji koneksi</button><div id="lg-api-msg" class="small muted"></div></div>
      </details>
    </div>
    <div id="lg-demo" class="demo-box hidden">
      <b>Mode Demo</b><div class="small muted" style="margin:4px 0 8px">Semua data contoh berlabel [DEMO] dan disimpan hanya di browser ini. Password: <span class="mono">demo1234</span></div>
      <div class="row wrap"><button class="btn sm" data-demo="admin">Admin</button><button class="btn sm" data-demo="supervisor">Supervisor</button><button class="btn sm" data-demo="surveyor">Surveyor</button><button class="btn sm" data-demo="viewer">Viewer</button></div>
    </div>
    <div class="login-foot"><span id="lg-ver"></span> · <a href="#" data-legal="terms">Syarat &amp; Ketentuan</a> · <a href="#" data-legal="privacy">Pemberitahuan Privasi</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <button class="btn icon ghost show-m" id="btn-menu" aria-label="Menu"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <img class="logo" id="hd-logo" alt="Logo" title="Klik untuk memperbesar">
    <div class="ttl grow"><b id="hd-title">Universal Mobile Mapping GIS</b><small id="hd-sub"></small></div>
    <span class="badge b-pending hidden" id="hd-demo" title="Mode demo: data contoh disimpan di browser">DEMO</span>
    <span class="pill" id="pill-net" title="Status koneksi"><span class="dot"></span><span class="lbl">Online</span></span>
    <span class="pill" id="pill-sync" title="Antrean sinkronisasi"><span class="lbl">Tersinkron</span></span>
    <div class="avatar" id="hd-avatar" title="Akun"></div>
  </header>
  <nav class="sidenav" id="sidenav"></nav>
  <main id="main">
    <section class="tab map" data-tab="map">
      <div id="map"></div>
      <div class="map-top">
        <select class="input" id="sel-project" aria-label="Proyek"></select>
        <select class="input" id="sel-layer" aria-label="Layer untuk data baru"></select>
      </div>
      <div class="tools" id="tools">
        <button class="btn" data-tool="Point" title="Rekam titik"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
        <button class="btn" data-tool="LineString" title="Rekam garis"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18l6-8 4 4 6-9"/><circle cx="4" cy="18" r="1.8"/><circle cx="20" cy="5" r="1.8"/></svg></button>
        <button class="btn" data-tool="Polygon" title="Rekam poligon"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7l7-4 7 5-2 10H7z"/></svg></button>
        <button class="btn" data-tool="measure" title="Ukur jarak/luas"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
        <button class="btn" id="btn-gps" title="Posisi GPS / ikuti"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>

    insert: insert, insertMany: insertMany, update: update,
    putText: putText, getText: getText, freeText: freeText, putJson: putJson, getJson: getJson,

})();

})();

function audit(ctx, action, entity, entityId, detail) {

    if (d.length > 2000) d = d.substr(0, 2000) + '…';

/**
 * 03_License.gs — verifikasi lisensi RSA-SHA256 (RSASSA-PKCS1-v1_5).

  BASIC:      { label: 'Basic',      max_users: 10,     max_features: 5000,    offline_pmtiles: false, branding: true },
  PRO:        { label: 'Pro',        max_users: 50,     max_features: 50000,   offline_pmtiles: true,  branding: true },

    if (o2 === 0 && onSeg(p1, p4, p2)) return true;
    if (o3 === 0 && onSeg(p3, p1, p4)) return true;
    if (o4 === 0 && onSeg(p3, p2, p4)) return true;
    return false;
  }

  /** Deteksi self-intersection ring (O(n^2), dibatasi 3000 vertex demi kinerja). */
  function ringSelfIntersects(ring) {
    var n = ring.length - 1;
    if (n > 3000) return false;
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        if (Math.abs(i - j) <= 1 || (i === 0 && j === n - 1)) continue;
        if (segIntersect(ring[i], ring[i + 1], ring[j], ring[j + 1])) return true;
      }
    }
    return false;
  }

  function ringArea(ring) {
    // Luas pada bola (metode Chamberlain & Duquette, sama seperti turf.js)
    if (ring.length > 1 && samePos(ring[0], ring[ring.length - 1])) ring = ring.slice(0, -1);
    var area = 0, n = ring.length;
    if (n < 3) return 0;
    for (var i = 0; i < n; i++) {
      var lower = ring[i], middle = ring[(i + 1) % n], upper = ring[(i + 2) % n];
      area += (upper[0] * toRad - lower[0] * toRad) * Math.sin(middle[1] * toRad);
    }
    return Math.abs(area * R * R / 2);
  }

  function haversine(a, b) {
    var dLat = (b[1] - a[1]) * toRad, dLon = (b[0] - a[0]) * toRad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function lineLength(coords) {
    var d = 0;
    for (var i = 1; i < coords.length; i++) d += haversine(coords[i - 1], coords[i]);
    return d;
  }

  function bbox(geom) {
    var b = [180, 90, -180, -90];
    function add(p) { if (p[0] < b[0]) b[0] = p[0]; if (p[1] < b[1]) b[1] = p[1]; if (p[0] > b[2]) b[2] = p[0]; if (p[1] > b[3]) b[3] = p[1]; }
    if (geom.type === 'Point') add(geom.coordinates);
    else if (geom.type === 'LineString') geom.coordinates.forEach(add);
    else if (geom.type === 'Polygon') geom.coordinates.forEach(function (r) { r.forEach(add); });
    return b.map(function (v) { return Math.round(v * 1e7) / 1e7; });
  }

  function metrics(geom) {
    if (geom.type === 'LineString') return { length_m: Math.round(lineLength(geom.coordinates) * 100) / 100 };
    if (geom.type === 'Polygon') {
      var outer = ringArea(geom.coordinates[0]);
      for (var i = 1; i < geom.coordinates.length; i++) outer -= ringArea(geom.coordinates[i]);
      return { area_m2: Math.round(outer * 100) / 100, area_ha: Math.round(outer / 100) / 100, perimeter_m: Math.round(lineLength(geom.coordinates[0]) * 100) / 100 };
    }
    return {};
  }

  /**
   * Validasi geometri terhadap tipe yang diharapkan layer.
   * @return {{ok:boolean, errors:string[], bbox?:number[], metrics?:Object, vertices?:number}}
   */
  function validate(geom, expectedType, opts) {
    opts = opts || {};
    var errs = [];
    if (!geom || typeof geom !== 'object') return { ok: false, errors: ['Geometri kosong.'] };
    if (GEOM_TYPES_.indexOf(geom.type) < 0) return { ok: false, errors: ['Tipe geometri "' + geom.type + '" tidak didukung.'] };
    if (expectedType && geom.type !== expectedType) return { ok: false, errors: ['Tipe geometri ' + geom.type + ' tidak sesuai layer (' + expectedType + ').'] };
    var c = geom.coordinates, vertices = 0;
    if (!Array.isArray(c) || !c.length) return { ok: false, errors: ['Geometri kosong (tanpa koordinat).'] };
    if (geom.type === 'Point') {
      checkPos(c, errs, 'titik'); vertices = 1;
    } else if (geom.type === 'LineString') {
      if (c.length < 2) errs.push('Garis minimal 2 titik.');
      c.forEach(function (p, i) { if (errs.length < 5) checkPos(p, errs, '#' + (i + 1)); });
      vertices = c.length;
      if (!errs.length && lineLength(c) <= 0) errs.push('Panjang garis nol.');
    } else {
      c.forEach(function (ring, ri) {
        if (!Array.isArray(ring) || ring.length < 4) { errs.push('Ring ' + (ri + 1) + ' minimal 4 posisi (tertutup).'); return; }
        ring.forEach(function (p, i) { if (errs.length < 5) checkPos(p, errs, 'ring ' + (ri + 1) + ' #' + (i + 1)); });
        vertices += ring.length;
        if (!errs.length && !samePos(ring[0], ring[ring.length - 1])) errs.push('Ring ' + (ri + 1) + ' tidak tertutup.');
        if (!errs.length && ringSelfIntersects(ring)) errs.push('Ring ' + (ri + 1) + ' berpotongan sendiri (self-intersection).');
      });
      if (!errs.length && ringArea(c[0]) <= 0.01) errs.push('Luas poligon nol / terlalu kecil.');
    }
    if (vertices > (opts.maxVertices || 20000)) errs.push('Jumlah vertex (' + vertices + ') melebihi batas.');
    if (errs.length) return { ok: false, errors: errs, vertices: vertices };
    var bb = bbox(geom);
    if (opts.workArea && (bb[0] < opts.workArea[0] || bb[1] < opts.workArea[1] || bb[2] > opts.workArea[2] || bb[3] > opts.workArea[3])) {
      return { ok: false, errors: ['Geometri berada di luar area kerja proyek.'], vertices: vertices };
    }
    return { ok: true, errors: [], bbox: bb, metrics: metrics(geom), vertices: vertices };
  }

  /** Bulatkan koordinat ke 7 desimal (~1 cm) untuk menekan ukuran payload. */
  function round(geom) {
    function r(p) { return [Math.round(p[0] * 1e7) / 1e7, Math.round(p[1] * 1e7) / 1e7].concat(p.length > 2 && isNum(p[2]) ? [Math.round(p[2] * 100) / 100] : []); }
    if (geom.type === 'Point') return { type: 'Point', coordinates: r(geom.coordinates) };
    if (geom.type === 'LineString') return { type: 'LineString', coordinates: geom.coordinates.map(r) };
    return { type: 'Polygon', coordinates: geom.coordinates.map(function (ring) { return ring.map(r); }) };
  }

  /** Konversi WGS84 -> UTM (untuk tampilan surveyor; bukan transformasi datum lokal). */
  function toUTM(lon, lat) {
    var a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
    var zone = Math.floor((lon + 180) / 6) + 1;
    var lon0 = ((zone - 1) * 6 - 180 + 3) * toRad;
    var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    var phi = lat * toRad, lam = lon * toRad;
    var N = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi));
    var T = Math.tan(phi) * Math.tan(phi), C = ep2 * Math.cos(phi) * Math.cos(phi), A = Math.cos(phi) * (lam - lon0);
    var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * phi)
      + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * phi) - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * phi));
    var x = k0 * N * (A + (1 - T + C) * A * A * A / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
    var y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
    var south = lat < 0;
    if (south) y += 10000000;
    return { zone: zone, hemi: south ? 'S' : 'N', easting: Math.round(x * 100) / 100, northing: Math.round(y * 100) / 100, epsg: (south ? 32700 : 32600) + zone };
  }

  var GEOM_TYPES_ = ['Point', 'LineString', 'Polygon'];

  return { validate: validate, metrics: metrics, bbox: bbox, round: round, haversine: haversine, lineLength: lineLength, ringArea: ringArea, toUTM: toUTM, ringSelfIntersects: ringSelfIntersects };
})();

// ---- 05_Api.gs ----
/**
 * 05_Api.gs — dispatcher API (/api/v1), handler domain, sinkronisasi idempoten.
 * Entry point: doGet, doPost (fetch dari PWA GitHub Pages) dan api() (google.script.run).
 */

// ===================== Entry points =====================
function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.api === 'health') return jsonOut(dispatch('health', {}, ''));
  if (p.api === 'branding') return jsonOut(dispatch('branding.get', {}, ''));
  // createHtmlOutputFromFile (bukan template) agar kode klien tidak diproses sebagai scriptlet.
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle(APP.NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.DEFAULT);
}

function doPost(e) {
  var body = (e && e.postData && e.postData.contents) || '';
  if (body.length > APP.MAX_BATCH_CHARS + 100000) return jsonOut({ ok: false, error: { code: 'PAYLOAD_TOO_LARGE', message: 'Payload terlalu besar.' } });
  var req;
  try { req = JSON.parse(body); } catch (err) { return jsonOut({ ok: false, error: { code: 'BAD_JSON', message: 'Body bukan JSON yang valid.' } }); }
  return jsonOut(dispatch(String(req.action || ''), req.payload || {}, String(req.token || '')));
}

/** Dipanggil dari google.script.run (mode HtmlService). Mengembalikan string JSON. */
function api(action, payload, token) {
  return JSON.stringify(dispatch(String(action || ''), payload || {}, String(token || '')));
}

function jsonOut(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function include(name) { return HtmlService.createHtmlOutputFromFile(name).getContent(); }

// ===================== Dispatcher =====================
function dispatch(action, payload, token) {
  Db.reset();
  var h = HANDLERS[action];
  if (!h) return { ok: false, error: { code: 'UNKNOWN_ACTION', message: 'Aksi tidak dikenal: ' + String(action).substr(0, 40) } };
  try {
    var ctx = h.auth === false ? null : Sec.context(token);
    if (ctx && h.perm) Sec.need(ctx, h.perm);
    if (ctx) ctx.license = License.status();
    if (ctx && h.write) License.assertWritable(ctx.license);
    var data = h.lock ? withLock(function () { Db.reset(); if (ctx) ctx = Sec.context(token); if (ctx) ctx.license = License.status(); return h.fn(ctx, payload || {}, token); }) : h.fn(ctx, payload || {}, token);
    return { ok: true, data: data, server_time: nowIso() };
  } catch (e) {
    if (e instanceof AppError || (e && e.name === 'AppError')) {
      return { ok: false, error: { code: e.code, message: e.message, extra: e.extra || undefined }, status: e.status };
    }
    var ref = String(Date.now()).substr(-6);
    console.error('INTERNAL[' + ref + '] ' + action + ': ' + (e && e.stack ? e.stack : e));
    return { ok: false, error: { code: 'INTERNAL', message: 'Terjadi kesalahan server (ref ' + ref + ').' }, status: 500 };
  }
}

function withLock(fn) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(25000)) throw new AppError('BUSY', 'Server sedang sibuk, coba lagi.', 503);
  try { return fn(); } finally { lock.releaseLock(); }
}

// ===================== Helper =====================
function str(v, max, field) {
  v = v === undefined || v === null ? '' : String(v).trim();
  if (max && v.length > max) throw new AppError('VALIDATION', (field || 'Teks') + ' maksimal ' + max + ' karakter.');
  return v;
}

function cfgSet(key, value) {
  var row = Db.find('Config', function (c) { return c.key === key; });
  if (row) Db.update('Config', row, { value: value, updated_at: nowIso() });
  else Db.insert('Config', { key: key, value: value, updated_at: nowIso() });
}

var IMG_RE = /^data:image\/(jpeg|png|webp);base64,([A-Za-z0-9+/=]+)$/;
var IMG_MAGIC = { jpeg: '/9j/', png: 'iVBOR', webp: 'UklGR' };

function checkImage(dataUrl, maxChars, label) {
  dataUrl = String(dataUrl || '');
  if (dataUrl.length > maxChars) throw new AppError('FILE_TOO_LARGE', (label || 'Gambar') + ' terlalu besar (maks ' + Math.round(maxChars / 1370) + ' KB).');
  var m = IMG_RE.exec(dataUrl);
  if (!m) throw new AppError('BAD_FILE', (label || 'Gambar') + ' harus JPEG/PNG/WebP.');
  if (m[2].indexOf(IMG_MAGIC[m[1]]) !== 0) throw new AppError('BAD_FILE', 'Isi file tidak sesuai format ' + m[1] + '.');
  return { mime: 'image/' + m[1], b64: m[2] };
}

/** Penyimpanan foto/gambar: Google Drive (default) atau potongan di sheet Blobs. */
var Media = {
  save: function (dataUrl, name, maxChars) {
    var img = checkImage(dataUrl, maxChars || APP.MAX_PHOTO_CHARS, 'Foto');
    var mode = PropertiesService.getScriptProperties().getProperty('PHOTO_STORE') || APP.PHOTO_STORE;
    if (mode === 'drive') {
      var folderId = PropertiesService.getScriptProperties().getProperty('PHOTO_FOLDER_ID');
      if (folderId) {
        var blob = Utilities.newBlob(Utilities.base64Decode(img.b64), img.mime, name || ('foto_' + Date.now()));
        var f = DriveApp.getFolderById(folderId).createFile(blob);
        return 'drive:' + f.getId();
      }
    }
    return 'sheet:' + Db.putText(dataUrl, true).substr(Db.BLOB_PREFIX.length);
  },
  load: function (ref) {
    ref = String(ref || '');
    if (ref.indexOf('drive:') === 0) {
      var b = DriveApp.getFileById(ref.substr(6)).getBlob();
      return 'data:' + b.getContentType() + ';base64,' + Utilities.base64Encode(b.getBytes());
    }
    if (ref.indexOf('sheet:') === 0) return Db.getText(Db.BLOB_PREFIX + ref.substr(6));
    return '';
  },
  remove: function (ref) {
    ref = String(ref || '');
    try {
      if (ref.indexOf('drive:') === 0) DriveApp.getFileById(ref.substr(6)).setTrashed(true);
      else if (ref.indexOf('sheet:') === 0) Db.freeText(Db.BLOB_PREFIX + ref.substr(6));
    } catch (e) { console.warn('MEDIA_REMOVE ' + ref + ': ' + e.message); }
  }
};

  };

function cfgGet(k) { return License.cfg(k); }

/** Validasi atribut terhadap skema layer (backend adalah otoritas final). */
function validateAttrs(schema, attrs) {
  attrs = attrs && typeof attrs === 'object' && !Array.isArray(attrs) ? attrs : {};
  var errs = [], out = {}, known = {};
  (schema || []).forEach(function (f) {
    known[f.key] = 1;
    var v = attrs[f.key];
    var empty = v === undefined || v === null || v === '';
    if (empty) { if (f.required) errs.push('"' + (f.label || f.key) + '" wajib diisi.'); return; }
    switch (f.type) {
      case 'number': if (!isFinite(Number(v))) errs.push('"' + f.label + '" harus angka.'); else out[f.key] = Number(v); break;
      case 'integer': if (!/^-?\d+$/.test(String(v))) errs.push('"' + f.label + '" harus bilangan bulat.'); else out[f.key] = parseInt(v, 10); break;
      case 'bool': out[f.key] = v === true || v === 'true' || v === 1 || v === '1'; break;
      case 'date': if (!/^\d{4}-\d{2}-\d{2}$/.test(String(v))) errs.push('"' + f.label + '" format tanggal YYYY-MM-DD.'); else out[f.key] = String(v); break;
      case 'select': if ((f.options || []).indexOf(String(v)) < 0) errs.push('"' + f.label + '" harus salah satu pilihan.'); else out[f.key] = String(v); break;
      default: if (String(v).length > 5000) errs.push('"' + f.label + '" terlalu panjang.'); else out[f.key] = String(v);
    }
  });
  Object.keys(attrs).forEach(function (k) { if (!known[k]) errs.push('Atribut "' + k + '" tidak ada di skema layer.'); });
  return { ok: !errs.length, errors: errs, attrs: out };
}

function validateSchema(fields) {
  if (!Array.isArray(fields)) throw new AppError('VALIDATION', 'Skema atribut harus berupa daftar.');
  if (fields.length > 60) throw new AppError('VALIDATION', 'Maksimal 60 atribut per layer.');
  var seen = {};
  return fields.map(function (f) {
    var key = String(f.key || '').trim();
    if (!/^[a-z][a-z0-9_]{0,39}$/.test(key)) throw new AppError('VALIDATION', 'Kunci atribut "' + key + '" tidak valid (huruf kecil, angka, _).');
    if (seen[key]) throw new AppError('VALIDATION', 'Kunci atribut duplikat: ' + key);
    seen[key] = 1;
    var type = FIELD_TYPES.indexOf(f.type) >= 0 ? f.type : 'text';
    var opts = type === 'select' ? (Array.isArray(f.options) ? f.options : String(f.options || '').split(',')).map(function (o) { return String(o).trim(); }).filter(String).slice(0, 100) : [];
    if (type === 'select' && !opts.length) throw new AppError('VALIDATION', 'Atribut pilihan "' + key + '" belum punya opsi.');
    return { key: key, label: str(f.label || key, 80, 'Label'), type: type, required: !!f.required, options: opts };
  });
}

// ===================== Handlers =====================
var HANDLERS = {};

HANDLERS['health'] = { auth: false, fn: function () {
  var db = { ok: false };
  try { Db.sheet('Config'); db = { ok: true, sheets: Object.keys(SCHEMA).length }; } catch (e) { db = { ok: false, message: 'Spreadsheet tidak dapat diakses.' }; }
  return { status: db.ok ? 'ok' : 'degraded', app: APP.NAME, version: APP.VERSION, build: APP.BUILD, time: nowIso(), db: db };
} };

HANDLERS['branding.get'] = { auth: false, fn: function () {
  var s = settings();
  delete s.maptiler_key; // tidak diekspos ke pengguna anonim
  var logoRef = cfgGet('logo');
  s.logo = logoRef ? Media.load(logoRef) : '';
  s.app = APP.NAME; s.version = APP.VERSION;
  return s;
} };

HANDLERS['auth.login'] = { auth: false, lock: true, fn: function (_, p) {
  var username = str(p.username, 60).toLowerCase();
  var password = String(p.password || '');
  if (!username || !password) throw new AppError('VALIDATION', 'Username dan password wajib diisi.');
  if (Sec.loginLocked(username)) throw new AppError('LOCKED', 'Terlalu banyak percobaan gagal. Coba lagi dalam ' + APP.LOGIN_LOCK_MIN + ' menit.', 429);
  var user = Db.find('Users', function (u) { return u.username === username; });
  var ok = user && user.status === 'active' && Sec.verifyPassword(password, user.pass_hash);
  if (!ok) {
    var n = Sec.registerLoginFail(username);
    audit(user ? { org: { id: user.org_id }, user: user } : null, 'auth.login_fail', 'user', user ? user.id : '', { username: username, attempt: n });
    throw new AppError('BAD_CREDENTIALS', 'Username atau password salah.', 401);
  }
  var org = Db.find('Orgs', function (o) { return o.id === user.org_id; });
  if (!org || org.status !== 'active') throw new AppError('ORG_INACTIVE', 'Organisasi tidak aktif.', 403);
  Sec.clearLoginFail(username);
  var ses = Sec.createSession(user);
  Db.update('Users', user, { last_login: nowIso() });
  var ctx = { user: user, org: org, role: user.role, license: License.status() };
  audit(ctx, 'auth.login', 'user', user.id, '');
  return { token: ses.token, expires_at: ses.expires_at, boot: bootData(ctx, {}) };
} };

HANDLERS['auth.logout'] = { lock: true, fn: function (ctx, p, token) {
  Sec.revokeSession(token);
  audit(ctx, 'auth.logout', 'user', ctx.user.id, '');
  return { logged_out: true };
} };

function bootData(ctx, p) {
  var isAdmin = ctx.role === 'admin';
  var projects = Db.filter('Projects', function (x) { return x.org_id === ctx.org.id && x.deleted !== '1'; }).map(pubProject);
  var layers = Db.filter('Layers', function (x) { return x.org_id === ctx.org.id && x.deleted !== '1'; }).map(pubLayer);
  var users = Db.filter('Users', function (u) { return u.org_id === ctx.org.id; }).map(function (u) { return pubUser(u, isAdmin); });
  var feats = featurePage(ctx, { limit: 2000, offset: 0, since: p.since || '' });
  var me = pubUser(ctx.user, true);
  me.photo = ctx.user.photo ? Media.load(ctx.user.photo) : '';
  return {
    app: { name: APP.NAME, version: APP.VERSION, build: APP.BUILD },
    user: me, org: { id: ctx.org.id, name: ctx.org.name },
    perms: PERMS[ctx.role], settings: settings(), license: ctx.license,
    projects: projects, layers: layers, users: users,
    features: feats.items, features_total: feats.total, features_next: feats.next
  };
}

function featurePage(ctx, p) {
  var limit = Math.min(Math.max(Number(p.limit) || 500, 1), 2000);
  var offset = Math.max(Number(p.offset) || 0, 0);
  var since = String(p.since || '');
  var rows = Db.filter('Features', function (f) {
    return f.org_id === ctx.org.id && (!p.project_id || f.project_id === p.project_id) && (since ? f.updated_at > since : f.deleted !== '1');
  });
  var items = rows.slice(offset, offset + limit).map(pubFeature);
  return { items: items, total: rows.length, next: offset + limit < rows.length ? offset + limit : null };
}

// ---------- Sinkronisasi (idempoten, deteksi konflik per operasi) ----------
HANDLERS['sync.push'] = { perm: 'feature.read', lock: true, fn: function (ctx, p) {
  var ops = Array.isArray(p.ops) ? p.ops : [];
  if (!ops.length) return { results: [] };
  if (ops.length > APP.MAX_OPS_PER_BATCH) throw new AppError('VALIDATION', 'Maksimal ' + APP.MAX_OPS_PER_BATCH + ' operasi per batch.');
  var results = ops.map(function (op) {
    var opId = String(op && op.op_id || '');
    try {
      if (!/^[A-Za-z0-9-]{8,64}$/.test(opId)) throw new AppError('VALIDATION', 'op_id tidak valid.');
      var done = Db.find('SyncOps', function (s) { return s.op_id === opId; });
      if (done) {
        if (done.org_id !== ctx.org.id || done.user_id !== ctx.user.id) throw new AppError('FORBIDDEN', 'op_id milik pengguna lain.', 403);
        var prev = JSON.parse(done.result || '{}');
        var cur = Db.find('Features', function (f) { return f.id === prev.id && f.org_id === ctx.org.id; });
        return { op_id: opId, status: 'duplicate', feature: cur ? pubFeature(cur) : null };
      }
      return applyOp(ctx, op, opId);
    } catch (e) {
      if (e instanceof AppError || (e && e.name === 'AppError')) {
        return { op_id: opId, status: 'error', code: e.code, message: e.message, permanent: e.code !== 'BUSY' };
      }
      console.error('SYNC_OP ' + opId + ': ' + (e && e.stack ? e.stack : e));
      return { op_id: opId, status: 'error', code: 'INTERNAL', message: 'Kesalahan server saat memproses operasi.', permanent: false };
    }
  });
  return { results: results };
} };

function canEditFeature(ctx, f) {
  if (hasPerm(ctx.role, 'feature.write.any')) return true;
  if (!hasPerm(ctx.role, 'feature.write.own')) return false;
  return f.created_by === ctx.user.id && ['draft', 'revision', 'submitted'].indexOf(f.status) >= 0;
}

function applyOp(ctx, op, opId) {
  if (!hasPerm(ctx.role, 'feature.write.any') && !hasPerm(ctx.role, 'feature.write.own')) throw new AppError('FORBIDDEN', 'Role Anda tidak dapat mengubah data.', 403);
  License.assertWritable(ctx.license);
  var d = op.data || {};
  var id = String(d.id || '');
  if (!/^[A-Za-z0-9-]{8,64}$/.test(id)) throw new AppError('VALIDATION', 'ID fitur tidak valid.');
  var existing = Db.find('Features', function (f) { return f.id === id; });
  if (existing && existing.org_id !== ctx.org.id) throw new AppError('NOT_FOUND', 'Fitur tidak ditemukan.', 404);
  if (existing && !canEditFeature(ctx, existing)) {
    throw new AppError(existing.status === 'approved' ? 'LOCKED' : 'FORBIDDEN', existing.status === 'approved' ? 'Fitur sudah disetujui dan terkunci.' : 'Anda tidak berhak mengubah fitur ini.', 403);
  }
  if (existing && !op.force && Number(op.base_version) !== existing.version) {
    var cid = uuid();
    Db.insert('Conflicts', { id: cid, org_id: ctx.org.id, feature_id: id, user_id: ctx.user.id, base_version: Number(op.base_version) || 0, server_version: existing.version, status: 'open', created_at: nowIso() });
    audit(ctx, 'sync.conflict', 'feature', id, { base: op.base_version, server: existing.version });
    return { op_id: opId, status: 'conflict', conflict_id: cid, server: pubFeature(existing) };
  }
  var now = nowIso(), row;
  if (op.type === 'delete') {
    if (!existing) throw new AppError('NOT_FOUND', 'Fitur tidak ditemukan.', 404);
    Db.update('Features', existing, { deleted: '1', version: existing.version + 1, updated_by: ctx.user.id, updated_at: now });
    row = existing;
    audit(ctx, 'feature.delete', 'feature', id, { op_id: opId });
  } else if (op.type === 'upsert') {
    var layer = Db.find('Layers', function (l) { return l.id === (existing ? existing.layer_id : d.layer_id) && l.org_id === ctx.org.id && l.deleted !== '1'; });
    if (!layer) throw new AppError('VALIDATION', 'Layer tidak ditemukan atau sudah dihapus.');
    var project = Db.find('Projects', function (x) { return x.id === layer.project_id && x.org_id === ctx.org.id && x.deleted !== '1'; });
    if (!project) throw new AppError('VALIDATION', 'Proyek tidak ditemukan.');
    if (project.status === 'archived') throw new AppError('LOCKED', 'Proyek sudah diarsipkan.', 403);
    var geomStr = JSON.stringify(d.geometry || null);
    if (geomStr.length > APP.MAX_GEOM_CHARS) throw new AppError('PAYLOAD_TOO_LARGE', 'Geometri terlalu besar.');
    var gv = Geo.validate(d.geometry, layer.geom_type, { maxVertices: APP.MAX_VERTICES, workArea: project.work_area ? JSON.parse(project.work_area) : null });
    if (!gv.ok) throw new AppError('INVALID_GEOMETRY', gv.errors.join(' '), 422, { errors: gv.errors });
    var av = validateAttrs(Db.getJson(layer.schema_json, []), d.attrs);
    if (!av.ok) throw new AppError('INVALID_ATTRIBUTES', av.errors.join(' '), 422, { errors: av.errors });
    if (JSON.stringify(av.attrs).length > APP.MAX_ATTR_CHARS) throw new AppError('PAYLOAD_TOO_LARGE', 'Atribut terlalu besar.');
    var status = String(d.status || 'draft');
    var allowedStatus = hasPerm(ctx.role, 'feature.review') ? FEATURE_STATUS : ['draft', 'submitted'];
    if (allowedStatus.indexOf(status) < 0) throw new AppError('FORBIDDEN', 'Status "' + status + '" tidak diizinkan untuk role Anda.', 403);
    if (!existing) {
      var count = Db.filter('Features', function (f) { return f.deleted !== '1'; }).length;
      if (count >= ctx.license.max_features) throw new AppError('LICENSE_LIMIT', 'Batas jumlah fitur lisensi tercapai (' + ctx.license.max_features + ').', 402);
    }
    // Foto: ref lama hanya boleh dipertahankan jika memang milik fitur ini; data URL baru disimpan.
    var oldPhotos = existing ? Db.getJson(existing.photos, []) : [];
    var photos = [];
    (Array.isArray(d.photos) ? d.photos : []).slice(0, APP.MAX_PHOTOS + 1).forEach(function (ph, i) {
      if (typeof ph !== 'string') return;
      if (ph.indexOf('data:') === 0) photos.push(Media.save(ph, 'feat_' + id + '_' + i));
      else if (oldPhotos.indexOf(ph) >= 0) photos.push(ph);
    });
    if (photos.length > APP.MAX_PHOTOS) throw new AppError('VALIDATION', 'Maksimal ' + APP.MAX_PHOTOS + ' foto per fitur.');
    oldPhotos.forEach(function (ph) { if (photos.indexOf(ph) < 0) Media.remove(ph); });
    var gps = d.gps && typeof d.gps === 'object' ? {
      accuracy: isFinite(Number(d.gps.accuracy)) ? Number(d.gps.accuracy) : null,
      altitude: isFinite(Number(d.gps.altitude)) && d.gps.altitude !== null ? Number(d.gps.altitude) : null,
      source: str(d.gps.source, 20), timestamp: str(d.gps.timestamp, 40), samples: Number(d.gps.samples) || 0
    } : null;
    var geom = Geo.round(d.geometry);
    if (existing) Db.freeText(existing.geometry);
    var fields = {
      geom_type: layer.geom_type, geometry: Db.putJson(geom), bbox: JSON.stringify(gv.bbox), attrs: Db.putJson(av.attrs),
      photos: JSON.stringify(photos), gps: JSON.stringify(gps), metrics: JSON.stringify(gv.metrics), status: status,
      updated_by: ctx.user.id, updated_at: now, deleted: ''
    };
    if (existing) {
      if (existing.attrs) Db.freeText(existing.attrs);
      fields.version = existing.version + 1;
      Db.update('Features', existing, fields);
      row = existing;
    } else {
      fields.id = id; fields.org_id = ctx.org.id; fields.project_id = layer.project_id; fields.layer_id = layer.id;
      fields.version = 1; fields.created_by = ctx.user.id; fields.created_at = now; fields.review_by = ''; fields.review_note = '';
      row = Db.insert('Features', fields);
      row = Db.find('Features', function (f) { return f.id === id; });
    }
    audit(ctx, existing ? 'feature.update' : 'feature.create', 'feature', id, { op_id: opId, status: status, forced: !!op.force });
  } else {
    throw new AppError('VALIDATION', 'Tipe operasi tidak dikenal.');
  }
  Db.insert('SyncOps', { op_id: opId, org_id: ctx.org.id, user_id: ctx.user.id, entity_id: id, result: JSON.stringify({ id: id, version: row.version }), created_at: now });
  return { op_id: opId, status: 'applied', feature: pubFeature(row) };
}

HANDLERS['features.review'] = { perm: 'feature.review', write: true, lock: true, fn: function (ctx, p) {

  var note = str(p.note, 1000, 'Catatan');
  if (to !== 'approved' && !note) throw new AppError('VALIDATION', 'Catatan wajib diisi untuk revisi/penolakan.');
  Db.update('Features', f, { status: to, review_by: ctx.user.id, review_note: note, version: f.version + 1, updated_by: ctx.user.id, updated_at: nowIso() });

/**
 * 06_Setup.gs — instalasi, migrasi skema (idempoten), pembuatan organisasi,
 * data contoh berlabel DEMO, dan pemeliharaan.
 * Jalankan setup() SEKALI dari editor Apps Script.
 */
var SCHEMA_VERSION = 1;

/** Instalasi awal. Aman dijalankan ulang (tidak menimpa data). */
function setup() {
  var props = PropertiesService.getScriptProperties();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss && !props.getProperty('SPREADSHEET_ID')) {
    ss = SpreadsheetApp.create('UMG Enterprise — Database');
    props.setProperty('SPREADSHEET_ID', ss.getId());
  }
  Db.reset();
  var report = migrate();
  if (!License.cfg('installed_at')) cfgSet('installed_at', nowIso());
  if (APP.PHOTO_STORE === 'drive' && !props.getProperty('PHOTO_FOLDER_ID') && typeof DriveApp !== 'undefined') {
    try {
      var folder = DriveApp.createFolder('UMG Enterprise — Foto Lapangan');

  /** Unduh seluruh arsip ke IndexedDB agar dapat dipakai tanpa internet. */
  download: async function (url, onProgress) {
    if (!PMT.allowedOffline()) throw new Error('PMTiles offline tersedia mulai lisensi Pro.');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    var r = await fetch(url, { credentials: 'omit' });
    if (!r.ok) throw new Error('Gagal mengunduh (HTTP ' + r.status + ').');
    var total = Number(r.headers.get('content-length') || 0);
    if (navigator.storage && navigator.storage.estimate && total) { var est = await navigator.storage.estimate(); if (est.quota && est.usage + total > est.quota * 0.9) throw new Error('Ruang penyimpanan browser tidak cukup (' + fmtNum(total / 1048576, 0) + ' MB diperlukan).'); }
    var reader = r.body.getReader(), chunks = [], got = 0;
    for (;;) { var x = await reader.read(); if (x.done) break; chunks.push(x.value); got += x.value.length; if (onProgress) onProgress(got, total); }
    var blob = new Blob(chunks, { type: 'application/octet-stream' });
    var head = new Uint8Array(await blob.slice(0, 7).arrayBuffer());
    if (String.fromCharCode.apply(null, head) !== 'PMTiles') throw new Error('File yang diunduh bukan arsip PMTiles yang valid.');
    var name = decodeURIComponent(url.split('?')[0].split('/').pop() || 'arsip.pmtiles');
    await IDB.put('pmtiles', { name: name, blob: blob, size: blob.size, url: url, saved_at: new Date().toISOString() });
    return { name: name, blob: blob };
  },
  importFile: async function (file) {
    if (!PMT.allowedOffline()) throw new Error('PMTiles offline tersedia mulai lisensi Pro.');
    var head = new Uint8Array(await file.slice(0, 7).arrayBuffer());
    if (String.fromCharCode.apply(null, head) !== 'PMTiles') throw new Error('File bukan arsip PMTiles (header tidak cocok).');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    await IDB.put('pmtiles', { name: file.name, blob: file, size: file.size, url: '', saved_at: new Date().toISOString() });
    return { name: file.name, blob: file };
  },
  renderBox: async function (box) {
    if (!box) return;
    var list = await IDB.all('pmtiles').catch(function () { return []; });
    var def = S.settings.pmtiles_default || '';
    var op = Number(LS.get('umg_pmt_opacity') || 1);
    box.innerHTML = (PMT.active ? '<div class="small" style="margin-bottom:6px">Aktif: <b>' + esc(PMT.active.label) + '</b> · z' + PMT.active.header.minZoom + '–' + PMT.active.header.maxZoom + ' <button class="btn sm" id="pmt-off">Lepas</button></div>' : '<div class="small muted" style="margin-bottom:6px">Belum ada foto udara aktif.</div>') +
      '<label class="f small">Opasitas<input type="range" min="0.1" max="1" step="0.05" value="' + op + '" id="pmt-op"></label>' +
      '<label class="f small" style="margin-top:6px">URL PMTiles (HTTPS, mendukung HTTP Range &amp; CORS)<input class="input small mono" id="pmt-url" placeholder="https://…/ortho.pmtiles" value="' + esc(def) + '"></label>' +
      '<div class="row wrap" style="margin-top:6px"><button class="btn sm primary" id="pmt-online">Muat online</button><button class="btn sm" id="pmt-dl"' + (PMT.allowedOffline() ? '' : ' disabled title="Butuh lisensi Pro"') + '>Unduh untuk offline</button>' +
      '<label class="btn sm"' + (PMT.allowedOffline() ? '' : ' style="opacity:.5;pointer-events:none"') + '>Buka file lokal<input type="file" accept=".pmtiles" id="pmt-file" hidden></label></div>' +
      '<div class="progress hidden" id="pmt-prog" style="margin-top:8px"><div></div></div><div class="small muted" id="pmt-msg"></div>' +
      '<div style="margin-top:8px">' + (list.length ? list.map(function (r) { return '<div class="lyr"><span class="grow small"><b>' + esc(r.name) + '</b><br><span class="muted">' + fmtNum(r.size / 1048576, 1) + ' MB · ' + fmtDate(r.saved_at) + '</span></span><button class="btn sm" data-use="' + esc(r.name) + '">Pakai</button><button class="btn sm danger" data-rm="' + esc(r.name) + '">Hapus</button></div>'; }).join('') : '<div class="small muted">Tidak ada arsip offline tersimpan.</div>') + '</div>' +
      (PMT.allowedOffline() ? '' : '<div class="small" style="color:var(--warn)">Penyimpanan PMTiles offline tersedia pada lisensi Pro/Enterprise.</div>');
    var msg = $('#pmt-msg', box);
    var run = async function (fn) { msg.textContent = 'Memproses…'; try { var a = await fn(); msg.textContent = a ? 'OK: ' + a.label : ''; PMT.renderBox(box); } catch (e) { msg.textContent = ''; toast(e.message, 'err', 6000); } };
    var off = $('#pmt-off', box); if (off) off.onclick = function () { PMT.detach(); LS.set('umg_pmt_active', null); PMT.renderBox(box); };
    $('#pmt-op', box).oninput = function (e) { PMT.setOpacity(e.target.value); };
    $('#pmt-online', box).onclick = function () { var u = $('#pmt-url', box).value.trim(); if (!PMT.okUrl(u)) return toast('URL harus diawali https://', 'err'); run(function () { return PMT.attach(u); }); };
    $('#pmt-dl', box).onclick = function () {
      var u = $('#pmt-url', box).value.trim(); if (!PMT.okUrl(u)) return toast('URL harus diawali https://', 'err');
      var pr = $('#pmt-prog', box); pr.classList.remove('hidden');
      run(async function () { var rec = await PMT.download(u, function (g, t) { $('div', pr).style.width = t ? (g / t * 100).toFixed(1) + '%' : '50%'; msg.textContent = fmtNum(g / 1048576, 1) + (t ? ' / ' + fmtNum(t / 1048576, 1) : '') + ' MB'; }); return PMT.attach(rec, { label: rec.name + ' (offline)' }); });
    };
    $('#pmt-file', box).onchange = function (e) { var f = e.target.files[0]; if (f) run(async function () { var rec = await PMT.importFile(f); return PMT.attach(rec, { label: rec.name + ' (offline)' }); }); };
    $$('[data-use]', box).forEach(function (b) { b.onclick = function () { run(async function () { var r = await IDB.get('pmtiles', b.getAttribute('data-use')); return PMT.attach({ name: r.name, blob: r.blob }, { label: r.name + ' (offline)' }); }); }; });
    $$('[data-rm]', box).forEach(function (b) { b.onclick = async function () { var n = b.getAttribute('data-rm'); if (!(await confirmBox('Hapus arsip offline', 'Hapus "' + n + '" dari perangkat?', 'Hapus', true))) return; if (PMT.active && PMT.active.src.name === n) { PMT.detach(); LS.set('umg_pmt_active', null); } await IDB.del('pmtiles', n); PMT.renderBox(box); }; });
  }
};

// ======================================================= Gambar geometri (titik/garis/poligon/ukur)
var Draw = {
  mode: null, coords: [], target: null, layer: null, sidePoints: 0,
  key: function () { return 'umg_draft_' + (S.user ? S.user.id : ''); },
  start: function (mode, opt) {
    opt = opt || {};
    if (mode !== 'measure') {
      if (!can('feature.write.own') && !can('feature.write.any')) return toast('Role Anda hanya dapat melihat data.', 'err');
      if (S.license.read_only) return toast(S.license.message || 'Lisensi baca-saja.', 'err');
      var l = layerById(opt.layerId || S.layerId);
      if (!l) return toast('Pilih/buat layer terlebih dahulu (menu Proyek & Layer).', 'err');
      if (l.geom_type !== mode) { var alt = S.layers.find(function (x) { return x.project_id === S.projectId && x.geom_type === mode; }); if (!alt) return toast('Tidak ada layer ' + ({ Point: 'titik', LineString: 'garis', Polygon: 'poligon' }[mode]) + ' di proyek ini.', 'err'); l = alt; S.layerId = l.id; MapView.fillSelectors(); }
      Draw.layer = l;
    }
    Draw.cancel(true, false, true);
    Draw.mode = mode; Draw.target = opt.featureId || null; Draw.coords = (opt.coords || []).slice(); Draw.sidePoints = opt.sidePoints || 0;
    Draw._hist = Hist.push(Draw.onBack, 'draw');

    if (MapView.map) MapView.map.getCanvas().style.cursor = 'crosshair';
    Draw.render(); Draw.panel(); Draw.save();
  },
  /** Tombol Back saat merekam: jangan langsung membuang vertex. */
  onBack: async function () {
    Draw._hist = null;
    if (Draw.mode && Draw.mode !== 'measure' && Draw.coords.length) {
      var wasTrack = Draw.trackState();
      if (wasTrack === 'on') Draw.setTrack('paused');
      var ok = await confirmBox('Hentikan rekaman?', Draw.coords.length + ' vertex akan dibuang. Pilih "Lanjut merekam" untuk meneruskan (rekaman tetap tersimpan sebagai draf).', 'Buang rekaman', true);
      if (!ok) { if (Draw.mode) Draw._hist = Hist.push(Draw.onBack, 'draw'); if (wasTrack === 'on') Draw.setTrack('on'); return; }
    }
    Draw.cancel(false, true);
  },
  add: function (p, fromGps) {
    if (!Draw.mode) return;
    if (Draw.mode === 'Point') { Draw.coords = [p]; Draw.render(); Draw.finish(fromGps ? { accuracy: GPS.pos && GPS.pos.acc, altitude: GPS.pos && GPS.pos.alt, timestamp: new Date().toISOString(), source: 'device', samples: 1 } : null); return; }
    Draw.coords.push(p); Draw.render(); Draw.panel(); Draw.save();
  },
  undo: function () { Draw.coords.pop(); Draw.render(); Draw.panel(); Draw.save(); },
  // ---- status rekam jejak: off | on | paused ----
  trackState: function () { return !GPS.track ? 'off' : (GPS.trackPaused ? 'paused' : 'on'); },
  setTrack: function (st) {
    if (st === 'off') { GPS.track = false; GPS.trackPaused = false; }
    else if (st === 'on') { if (!GPS.track) GPS.trackLast = null; GPS.track = true; GPS.trackPaused = false; GPS.start(); if (GPS.pos && GPS.age() <= 10) GPS.trackPoint(); }
    else if (st === 'paused') { GPS.track = true; GPS.trackPaused = true; }
    if (Draw.mode) { Draw.panel(); Draw.save(); }
  },
  pointLayers: function () { return S.layers.filter(function (x) { return x.project_id === (Draw.layer ? Draw.layer.project_id : S.projectId) && x.geom_type === 'Point'; }); },
  /** Ambil titik GPS (fitur titik terpisah) di tengah rekaman garis/poligon tanpa menghentikan rekaman. */
  sidePoint: async function (btn) {
    var pls = Draw.pointLayers(); if (!pls.length) return toast('Proyek ini belum punya layer titik.', 'err');
    var lid = (LS.get('umg_side_layer') && pls.find(function (x) { return x.id === LS.get('umg_side_layer'); })) ? LS.get('umg_side_layer') : pls[0].id;
    var avg = LS.get('umg_side_avg') !== '0', autoPause = LS.get('umg_side_pause') !== '0';

    if (autoPause && before === 'on') Draw.setTrack('paused');
    var meta;
    try {
      if (btn) { btn.disabled = true; btn.textContent = avg ? 'Mengambil sampel 5 dtk…' : 'Membaca GPS…'; }
      if (avg) meta = await GPS.sample(5);
      else {
        if (!GPS.pos || GPS.watch === null) { GPS.start(); throw new Error('Menyalakan GPS… tunggu posisi stabil lalu coba lagi.'); }
        if (GPS.age() > 10) throw new Error('Posisi GPS sudah lama (' + GPS.age() + ' dtk). Tunggu pembaruan.');
        meta = { lon: GPS.pos.lon, lat: GPS.pos.lat, accuracy: GPS.pos.acc, altitude: GPS.pos.alt, samples: 1, timestamp: new Date().toISOString(), source: 'device' };
      }
    } catch (e) { toast(e.message, 'err', 5000); if (autoPause && before === 'on') Draw.setTrack('on'); else Draw.panel(); return; }
    var l = layerById(lid);
    var resume = function (saved) {
      if (saved) { Draw.sidePoints++; toast('Titik tersimpan. Rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[Draw.mode] || '') + ' dilanjutkan.', 'ok'); }
      if (Draw.mode && autoPause && before === 'on' && Draw.trackState() === 'paused') Draw.setTrack('on'); else if (Draw.mode) { Draw.panel(); Draw.save(); }
    };
    FeatureForm.open({ id: uuid(), layer_id: l.id, project_id: l.project_id, geometry: { type: 'Point', coordinates: [meta.lon, meta.lat] }, attrs: {}, photos: [], gps: { accuracy: meta.accuracy, altitude: meta.altitude, samples: meta.samples, timestamp: meta.timestamp, source: meta.source }, status: 'draft', version: 0, _new: true },
      { onDone: resume, note: 'Rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[Draw.mode]) + ' (' + Draw.coords.length + ' vertex) ' + (Draw.trackState() === 'paused' ? 'dijeda' : 'tetap berjalan') + ' dan tidak hilang.' });
  },
  geometry: function () {
    var c = Draw.coords, m = Draw.mode;

    return c.length >= 3 ? { type: 'Polygon', coordinates: [c.concat([c[0]])] } : null;
  },
  render: function () {

    var s = MapView.map.getSource('draft'); if (s) s.setData({ type: 'FeatureCollection', features: Draw.mode ? feats : [] });
  },
  /** Draf disimpan setiap perubahan agar rekaman tidak hilang (reload, aplikasi tertutup, baterai habis). */
  save: function () {
    if (!S.user) return;
    if (!Draw.mode || Draw.mode === 'measure' || Draw.mode === 'Point' || !Draw.coords.length) { LS.set(Draw.key(), null); return; }
    LS.set(Draw.key(), JSON.stringify({ mode: Draw.mode, layerId: Draw.layer.id, target: Draw.target, coords: Draw.coords, track: Draw.trackState(), sidePoints: Draw.sidePoints, ts: new Date().toISOString() }));
  },
  restore: async function () {
    var d; try { d = JSON.parse(LS.get(Draw.key()) || 'null'); } catch (e) { d = null; }
    if (!d || !d.coords || !d.coords.length || Draw.mode) return;
    var l = layerById(d.layerId);
    if (!l) { LS.set(Draw.key(), null); return; }
    var ok = await confirmBox('Lanjutkan rekaman?', 'Ada rekaman ' + ({ LineString: 'garis', Polygon: 'poligon' }[d.mode]) + ' "' + l.name + '" yang belum selesai (' + d.coords.length + ' vertex, ' + fmtDate(d.ts) + ').', 'Lanjutkan');
    if (!ok) { if (await confirmBox('Buang rekaman?', 'Rekaman ' + d.coords.length + ' vertex akan dihapus permanen.', 'Buang', true)) LS.set(Draw.key(), null); return; }
    if (l.project_id !== S.projectId) { S.projectId = l.project_id; MapView.refreshData(); }
    Draw.start(d.mode, { layerId: l.id, featureId: d.target, coords: d.coords, sidePoints: d.sidePoints });
    if (d.track !== 'off') Draw.setTrack('paused');
    toast('Rekaman dipulihkan' + (d.track !== 'off' ? ' — rekam jejak dijeda, tekan Lanjutkan.' : '.'), 'ok', 4000);
  },
  panel: function () {
    var p = $('#draw-panel');
    if (!Draw.mode) { p.classList.add('hidden'); return; }
    var g = Draw.geometry(), mt = g ? Geo.metrics(g) : {}, m = Draw.mode, ts = Draw.trackState(), rec = m === 'LineString' || m === 'Polygon';
    var name = m === 'measure' ? 'Pengukuran' : ('Rekam ' + ({ Point: 'titik', LineString: 'garis', Polygon: 'poligon' }[m]) + ' → ' + Draw.layer.name);
    var info = mt.area_m2 ? 'Luas ' + fmtNum(mt.area_m2, 1) + ' m² (' + fmtNum(mt.area_ha, 4) + ' ha) · Keliling ' + fmtNum(mt.perimeter_m, 1) + ' m' : (mt.length_m ? 'Panjang ' + fmtNum(mt.length_m, 1) + ' m' : (m === 'Point' ? 'Ketuk peta atau gunakan GPS.' : 'Ketuk peta untuk menambah vertex.'));

      (ts === 'on' ? '<button class="btn sm" data-d="track-pause">⏸ Jeda</button>' : '<button class="btn sm primary" data-d="track-on">▶ Lanjutkan</button>') + '<button class="btn sm" data-d="track-off" title="Hentikan penambahan vertex otomatis (vertex tetap)">■ Stop jejak</button>');
    p.innerHTML = '<div class="row wrap"><b class="grow">' + esc(name) + '</b>' + trackBadge + '<span class="badge">' + Draw.coords.length + ' vertex</span>' + (Draw.sidePoints ? '<span class="badge">' + Draw.sidePoints + ' titik diambil</span>' : '') + '</div><div class="small">' + info + '</div>' +
      (m === 'measure' ? '<div class="seg"><button data-mt="line" class="' + (Draw.measureType !== 'area' ? 'on' : '') + '">Jarak</button><button data-mt="area" class="' + (Draw.measureType === 'area' ? 'on' : '') + '">Luas</button></div>' : '') +
      '<div class="row wrap">' + (m === 'Point' ? '<button class="btn sm primary" data-d="gpsavg">Ambil GPS (rata-rata 5 dtk)</button><button class="btn sm" data-d="gps1">GPS sekarang</button>' : '<button class="btn sm" data-d="undo"' + (Draw.coords.length ? '' : ' disabled') + '>Undo</button><button class="btn sm" data-d="gpsv">+ Vertex GPS</button>' + trackBtns + (m !== 'measure' ? '<button class="btn sm primary" data-d="done">Selesai</button>' : '')) +

        '<label class="row small"><input type="checkbox" id="dp-avg"' + (LS.get('umg_side_avg') !== '0' ? ' checked' : '') + '> rata-rata 5 dtk</label><label class="row small"><input type="checkbox" id="dp-pause"' + (LS.get('umg_side_pause') !== '0' ? ' checked' : '') + '> jeda otomatis</label>'

    if (target) { var f = S.features.get(target); FeatureForm.open(Object.assign({}, f, { geometry: g, gps: gpsMeta || f.gps }), { onDone: back }); }

  },
  cancel: function (silent, fromBack, keepDraft) {

    if (MapView.map) MapView.map.getCanvas().style.cursor = '';

  }
};

// ======================================================= Formulir atribut fitur

    var l = layerById(f.layer_id); if (!l) return toast('Layer tidak ditemukan.', 'err');

    var fields = (l.schema || []).map(function (fd) {

// ======================================================= Sinkronisasi offline-first
var Sync = {
  running: false, timer: null, backoff: 2000, lastSync: LS.get('umg_last_sync') || '', lastError: '',
  pendingOps: async function () { if (!S.user) return []; var all = await IDB.all('ops').catch(function () { return []; }); return all.filter(function (o) { return o.user_id === S.user.id; }).sort(function (a, b) { return a.seq - b.seq; }); },
  loadLocal: async function (serverFeatures, fromCache) {

    else { var keep = new Map(); S.features.forEach(function (f, id) { if (f._pending) keep.set(id, f); }); S.features = keep; }
    list.forEach(function (f) { var c = Object.assign({}, f); delete c._pending; S.features.set(f.id, c); S.serverVer[f.id] = f._sv !== undefined ? f._sv : f.version; });

  persistFeatures: debounce(function () {

    IDB.kvSet('features', arr);
  }, 300),
  acceptServer: function (f) {
    if (!f) return;

    var cur = S.features.get(f.id);
    if (cur && cur._pending) return; // biarkan tampilan lokal hingga semua op selesai
    if (f.deleted) S.features.delete(f.id); else S.features.set(f.id, f);
  },
  applyLocal: function (op) {
    var cur = S.features.get(op.data.id);
    if (op.type === 'delete') { if (cur) S.features.set(cur.id, Object.assign({}, cur, { deleted: true, _pending: true })); return; }
    var l = layerById(op.data.layer_id) || {};
    S.features.set(op.data.id, Object.assign({}, cur || { created_by: S.user.id, created_at: op.created_at, version: 0 }, op.data, {
      project_id: l.project_id || op.data.project_id, geom_type: op.data.geometry.type, metrics: Geo.metrics(op.data.geometry), bbox: Geo.bbox(op.data.geometry),
      updated_by: S.user.id, updated_at: op.created_at, _pending: true, _new_unsynced: !cur || cur._new_unsynced
    }));
  },
  enqueue: async function (op) {
    var all = await Sync.pendingOps();
    var cur = S.features.get(op.data.id);
    // Gabungkan dengan op yang BELUM PERNAH dikirim untuk fitur yang sama (aman untuk idempotensi)
    var same = all.find(function (o) { return o.data.id === op.data.id && o.state === 'pending' && !o.attempts; });
    if (same && !(same.type === 'upsert' && op.type === 'delete' && !S.serverVer[op.data.id])) {
      same.type = op.type; same.data = op.type === 'delete' ? { id: op.data.id } : op.data; same.updated_at = new Date().toISOString();
      await IDB.put('ops', same); Sync.applyLocal(same);
    } else if (same && op.type === 'delete') {
      await IDB.del('ops', same.op_id); S.features.delete(op.data.id); // dibuat & dihapus sebelum pernah terkirim
    } else {
      var chained = all.some(function (o) { return o.data.id === op.data.id; });
      var rec = { op_id: uuid(), user_id: S.user.id, seq: Date.now() + Math.random(), created_at: new Date().toISOString(), type: op.type, data: op.data,
        base_version: chained ? null : (S.serverVer[op.data.id] || (cur && cur.version) || 0), state: 'pending', attempts: 0 };
      await IDB.put('ops', rec); Sync.applyLocal(rec);

    Sync.schedule(300);
  },
  schedule: function (ms) { clearTimeout(Sync.timer); Sync.timer = setTimeout(Sync.run, ms || 0); },
  run: async function () {
    if (Sync.running || !S.user || !S.token) return;

    Sync.running = true; Sync.updateBadge();
    var progressed = false;

      for (var guard = 0; guard < 200; guard++) {

        await Promise.all(batch.map(function (o) { return IDB.put('ops', o); }));

        for (var j = 0; j < res.results.length; j++) await Sync.handle(batch.find(function (b) { return b.op_id === res.results[j].op_id; }), res.results[j]);

    }
  },
  handle: async function (op, r) {

      if (r.feature) { S.serverVer[r.feature.id] = r.feature.version; if (!rest.length) { if (r.feature.deleted) S.features.delete(r.feature.id); else S.features.set(r.feature.id, r.feature); } }

  },

    $$('[data-cnt]').forEach(function (c) { c.textContent = n; c.classList.toggle('hidden', !n); });
  }
};

  parseCsv: function (text) {

  /** Ubah file menjadi daftar kandidat {geometry, attrs, errors} untuk layer tujuan. */
  parseFile: async function (file, layer) {
    if (file.size > 30 * 1024 * 1024) throw new Error('File terlalu besar (maks 30 MB).');
    var text = await file.text(), items = [];

        if (fd) out[fd.key] = props[k]; else warn.push(k);

      if (!Array.isArray(feats)) throw new Error('GeoJSON harus berupa Feature atau FeatureCollection.');
      if (j.crs && j.crs.properties && !/4326|CRS84/i.test(JSON.stringify(j.crs))) throw new Error('CRS GeoJSON bukan WGS84 (EPSG:4326). Reproyeksikan dahulu (RFC 7946).');

    } else if (/\.csv$/i.test(file.name)) {

      var rows = IO.parseCsv(text); if (rows.length < 2) throw new Error('CSV kosong.');
      var head = rows[0].map(function (h) { return h.trim(); }), low = head.map(function (h) { return h.toLowerCase(); });
      var iLat = low.findIndex(function (h) { return ['lat', 'latitude', 'lintang', 'y'].indexOf(h) >= 0; }), iLon = low.findIndex(function (h) { return ['lon', 'lng', 'long', 'longitude', 'bujur', 'x'].indexOf(h) >= 0; });
      if (iLat < 0 || iLon < 0) throw new Error('Kolom lat/lon (latitude/longitude) tidak ditemukan.');
      rows.slice(1).forEach(function (r) {
        var props = {}; head.forEach(function (h, i) { if (i !== iLat && i !== iLon) props[h] = r[i]; });
        var lat = Number(String(r[iLat]).replace(',', '.')), lon = Number(String(r[iLon]).replace(',', '.'));

    } else throw new Error('Format belum didukung. Gunakan GeoJSON (.geojson/.json) atau CSV koordinat. (GeoPackage/Shapefile: rencana fase berikutnya)');

      it.errors = errs;
    });
    return items;
  }
};

function readLogo(file) {
  return new Promise(function (res, rej) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return rej(new Error('Logo harus PNG/JPEG/WebP.'));
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { var k = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); var out = c.toDataURL('image/png'); if (out.length > 380000) out = c.toDataURL('image/webp', 0.9); if (out.indexOf('data:image/webp') !== 0 && out.length > 380000) out = c.toDataURL('image/jpeg', 0.85); if (out.length > 380000) return rej(new Error('Logo terlalu kompleks; gunakan gambar yang lebih sederhana.')); res(out); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Logo tidak dapat dibaca.')); };
    img.src = url;
  });

/* gis.js — Navigasi tombol Back (Hist), layer referensi (SHP/KML/KMZ/GeoJSON/GeoTIFF/GeoPDF), dan cetak peta A4/A3.
 * Pustaka berat dimuat sesuai kebutuhan (lazy) dari CDN dan di-cache service worker.
 */
'use strict';

// ======================================================= Tombol Back: kembali ke tampilan sebelumnya
var Hist = {
  stack: [], ignore: 0, lastBack: 0, enabled: false,
  init: function () {
    try { history.replaceState({ umg: 'base' }, ''); history.pushState({ umg: 'guard' }, ''); Hist.enabled = true; }
    catch (e) { Hist.enabled = false; console.warn('History API tidak tersedia', e); return; }
    if (Hist._bound) return;
    Hist._bound = true;
    window.addEventListener('popstate', Hist.onPop);
  },
  /** Daftarkan tampilan yang bisa ditutup dengan tombol Back. close(fromBack) dipanggil saat Back ditekan.
   *  Entri yang sudah ditutup lewat UI ditandai "stale" dan slot riwayatnya dipakai ulang — tanpa history.back()
   *  saat transisi UI (menghindari race pushState/back yang dapat membuat aplikasi keluar). */
  push: function (close, type) {
    var entry = { close: close, type: type || 'overlay' };
    if (!Hist.enabled || !S.user) return entry;
    var top = Hist.stack[Hist.stack.length - 1];
    if (top && top.stale) { Hist.stack[Hist.stack.length - 1] = entry; return entry; }
    Hist.stack.push(entry);
    try { history.pushState({ umg: 'v', n: Hist.stack.length }, ''); } catch (e) { /* abaikan */ }
    return entry;
  },
  release: function (entry) { if (entry && Hist.stack.indexOf(entry) >= 0) entry.stale = true; },
  releaseTabs: function () {
    for (var i = Hist.stack.length - 1; i >= 0 && (Hist.stack[i].type === 'tab' || Hist.stack[i].stale); i--) Hist.stack[i].stale = true;
  },
  reset: function () { Hist.stack = []; },
  onPop: function () {
    if (Hist.ignore > 0) { Hist.ignore--; return; }
    if (!S.user) return;
    var e = Hist.stack.pop();
    if (e && e.stale) { history.back(); return; }   // langkah kosong: lanjutkan mundur ke tampilan sebenarnya
    if (e) { try { e.close(true); } catch (er) { console.warn(er); } return; }
    // Di dasar riwayat: Back pertama kembali ke Peta / peringatan keluar, Back kedua (≤2 dtk) keluar aplikasi.
    if (S.tab !== 'map') { App.show('map', { fromBack: true }); history.pushState({ umg: 'guard' }, ''); return; }
    if (Date.now() - Hist.lastBack < 2000) { Hist.enabled = false; history.back(); return; }
    Hist.lastBack = Date.now();
    toast('Tekan Kembali sekali lagi untuk keluar');
    history.pushState({ umg: 'guard' }, '');
  }
};
